name: 'publish cli'
description: ''
inputs:
  homebrew-tap:
    description: 'homebrew tap'
    required: false
    default: 'upfluence/tap'
  workflow-filename:
    description: 'workflow filename'
    required: false
    default: 'homebrew-formula-update.yml'
  template:
    description: 'template'
    required: false
    default: 'template/formula.rb.template'
  target-ref:
    description: 'target ref'
    required: false
    default: 'main'
  version:
    description: 'target version'
    required: true
  definitions:
    description: 'definitions'
    required: true
  github-token:
    required: false
    description: 'github token to be used'
    default: ${{ github.token }}
  cli-version:
    required: false
    description: 'version of the cli to use'
    default: 'latest'

runs:
  using: 'composite'
  steps:
    - run: |
        mkdir -p ~/go/bin
        if [ "${{ inputs.cli-version }}" = "latest" ]; then
          curl -L https://github.com/upfluence/actions/releases/latest/download/publish-cli > ~/go/bin/publish-cli
        else
          curl -L https://github.com/upfluence/actions/releases/download/${{ inputs.cli-version }}/publish-cli > ~/go/bin/publish-cli
        fi
      shell: bash
    - run: chmod +x ~/go/bin/publish-cli
      shell: bash
    - run: ~/go/bin/publish-cli --release-version ${{ inputs.version }} --homebrew-tap ${{ inputs.homebrew-tap }} --workflow-filename ${{ inputs.workflow-filename }} --template ${{ inputs.template }} --target-ref ${{ inputs.target-ref }}
      shell: bash
      env:
        DEFINITIONS: ${{ inputs.definitions }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
