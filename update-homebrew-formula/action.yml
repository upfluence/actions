name: 'update homebrew formula'
description: ''
inputs:
  repository:
    description: 'target repository'
    required: true
  cli-name:
    description: 'cli name'
    required: true
  version:
    description: 'version'
    required: true
  binaries:
    description: 'binaries def [JSON formatted]'
    required: true
  template:
    description: 'path to the template'
    required: false
    default: 'template/formula.rb.template'
  github-token:
    required: false
    description: 'github token to be used'
    default: ${{ github.token }}
  cli-version:
    required: false
    description: 'version of the cli to use'
    default: 'latest'

runs:
  using: 'composite'
  steps:
    - run: bash "$GITHUB_ACTION_PATH/../scripts/download-cli" update-homebrew-formula ~/go/bin/update-homebrew-formula '${{ inputs.cli-version }}' "$ACTION_REF"
      shell: bash
      env:
        ACTION_REF: ${{ github.action_ref }}
    - run: ~/go/bin/update-homebrew-formula --release-version ${{ inputs.version }} --cli-name ${{ inputs.cli-name }} --repository ${{ inputs.repository }} --template ${{ inputs.template }}
      shell: bash
      env:
        BINARIES: ${{ inputs.binaries }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
