name: 'Create github release'
description: ''
inputs:
  version:
    description: 'target version'
    required: true
  attachments:
    description: '[CSV] attachments to uplaod to the release (accept globs)'
    required: false
    default: ''
  latest:
    description: 'mark the release as latest'
    required: false
    default: 'true'
  github-token:
    required: false
    description: 'github token to be used'
    default: ${{ github.token }}
  cli-version:
    required: false
    description: 'version of the cli to use'
    default: 'latest'
runs:
  using: 'composite'
  steps:
    - run: |
        mkdir -p ~/go/bin
        if [ "${{ inputs.cli-version }}" = "latest" ]; then
          curl -L https://github.com/upfluence/actions/releases/latest/download/create-github-release > ~/go/bin/create-github-release
        else
          curl -L https://github.com/upfluence/actions/releases/download/${{ inputs.cli-version }}/create-github-release > ~/go/bin/create-github-release
        fi
      shell: bash
    - run: chmod +x ~/go/bin/create-github-release
      shell: bash
    - run: ~/go/bin/create-github-release --release-version ${{ inputs.version }} --attachments '${{ inputs.attachments }}' --make-latest '${{ inputs.latest }}'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
