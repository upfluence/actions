name: 'configure github'
description: 'trade the GitHub OIDC token for a GitHub App installation token: assumes an AWS role allowed to sign with the KMS key holding the app private key, signs the app JWT with KMS and creates the installation token, requires the id-token: write permission'
inputs:
  app-id:
    description: 'ID (or client ID) of the GitHub App'
    required: true
  app-installation-id:
    description: 'ID of the GitHub App installation to create the token for'
    required: true
  kms-key-arn:
    description: 'ARN of the KMS key holding the GitHub App private key (RSA_2048, SIGN_VERIFY), its region is used for STS and KMS'
    required: true
  role-arn:
    description: 'ARN of the role to assume, it must be allowed to kms:Sign with the key and trust the token.actions.githubusercontent.com web identity'
    required: true
  audience:
    description: 'audience of the GitHub OIDC token'
    required: false
    default: 'sts.amazonaws.com'
  repositories:
    description: '[CSV] repositories the token is scoped to (name or owner/name, i.e. upfluence/man,helm-charts), every repository of the installation when empty'
    required: false
    default: ''
  permissions:
    description: '[CSV] permissions of the token as name=level (i.e. contents=read,pull-requests=write), levels are read, write or admin, names accept the workflow (pull-requests) and the API (pull_requests) syntaxes'
    required: false
    default: 'contents=read'
  env-names:
    description: '[CSV] environment variables the token is exported as to $GITHUB_ENV'
    required: false
    default: 'GH_TOKEN'
  git-config:
    description: 'rewrite the https://github.com/<owner> git urls to authenticate with the token'
    required: false
    default: 'false'
  cli-version:
    required: false
    description: 'version of the cli to use'
    default: 'latest'
outputs:
  token:
    description: 'GitHub App installation token, masked from the logs'
    value: ${{ steps.configure-github.outputs.token }}
  expires-at:
    description: 'expiration date of the token (RFC3339)'
    value: ${{ steps.configure-github.outputs.expires-at }}
runs:
  using: 'composite'
  steps:
    - run: |
        mkdir -p ~/go/bin
        if [ "${{ inputs.cli-version }}" = "latest" ]; then
          curl -fsSL https://github.com/upfluence/actions/releases/latest/download/configure-github > ~/go/bin/configure-github
        else
          curl -fsSL https://github.com/upfluence/actions/releases/download/${{ inputs.cli-version }}/configure-github > ~/go/bin/configure-github
        fi
      shell: bash
    - run: chmod +x ~/go/bin/configure-github
      shell: bash
    - id: configure-github
      run: ~/go/bin/configure-github
      shell: bash
      env:
        APP_ID: ${{ inputs.app-id }}
        APP_INSTALLATION_ID: ${{ inputs.app-installation-id }}
        KMS_KEY_ARN: ${{ inputs.kms-key-arn }}
        ROLE_ARN: ${{ inputs.role-arn }}
        AUDIENCE: ${{ inputs.audience }}
        REPOSITORIES: ${{ inputs.repositories }}
        PERMISSIONS: ${{ inputs.permissions }}
        ENV_NAMES: ${{ inputs.env-names }}
    - if: inputs.git-config == 'true'
      run: git config --global url."https://x-access-token:${TOKEN}@github.com/${OWNER}".insteadOf "https://github.com/${OWNER}"
      shell: bash
      env:
        TOKEN: ${{ steps.configure-github.outputs.token }}
        OWNER: ${{ github.repository_owner }}
