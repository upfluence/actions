name: 'build docker container'
description: ''
inputs:
  dockerfile-paths:
    description: '[CSV] dist directory'
    required: false
    default: 'Dockerfile'
  version:
    description: 'target version'
    required: true
  arg-mode:
    description: 'arg mode to pass build info, valid values: app,none'
    required: false
    default: 'app'
  additional-args:
    description: 'additional args values, i.e. foo=bar,biz=buz'
    required: false
    default: ''
  os:
    description: 'to be filled in the platform'
    required: false
    default: 'linux'
  archs:
    description: '[CSV] to be filled in the platform'
    required: false
    default: 'amd64'
  tag-mode:
    description: 'tag mode, valid values: app,none'
    required: false
    default: 'app'
  push-mode:
    description: 'push mode, valid values: tags,digest,none'
    required: false
    default: 'tags'
  additional-tags:
    description: 'additional tags'
    required: false
    default: '""'
  registries:
    description: '[CSV] list of registries to push to'
    required: false
    default: 'index.docker.io'
  override-repositories:
    description: 'rewrite repository name'
    required: false
    default: ''
  github-token:
    required: false
    description: 'github token to be used'
    default: ${{ github.token }}
  cli-version:
    required: false
    description: 'version of the cli to use'
    default: 'latest'
  gha-cache:
    description: 'enable GitHub Actions cache backend'
    required: false
    default: 'false'
outputs:
  digests:
    description: 'JSON object mapping platforms to image digests'
    value: ${{ steps.build-docker.outputs.digests }}

runs:
  using: 'composite'
  steps:
    - name: Expose Runtime Envs for Custom Tools
      if: inputs.gha-cache == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
          core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
    - run: bash "$GITHUB_ACTION_PATH/../scripts/download-cli" build-docker ~/go/bin/build-docker '${{ inputs.cli-version }}' '${{ github.action_ref }}'
      shell: bash
    - id: build-docker
      run: |
        ~/go/bin/build-docker --dockerfile-paths ${{ inputs.dockerfile-paths }} \
                              --release-version ${{ inputs.version }} \
                              --arg-mode ${{ inputs.arg-mode }} \
                              --additional-args '${{ inputs.additional-args }}' \
                               --os ${{ inputs.os }} --archs ${{ inputs.archs }} \
                               --tag-mode ${{ inputs.tag-mode }} \
                               --push-mode ${{ inputs.push-mode }} \
                               --additional-tags '${{ inputs.additional-tags }}' \
                              --override-repositories '${{ inputs.override-repositories }}' \
                              --registries ${{ inputs.registries }} \
                              --gha-cache ${{ inputs.gha-cache }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
