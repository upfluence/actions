name: ci

on:
  push:
    branches:
      - 'master'
      - 'dev'
  pull_request:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Install Go
        uses: actions/setup-go@v3
        with:
          go-version: 1.25.x
      - name: Checkout
        uses: actions/checkout@v3
      - name: Cache Modules
        uses: actions/cache@v3
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-v1-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Run tests
        run: go test -v ./...
  release:
    name: Release
    runs-on: ubuntu-24.04
    needs: test
    permissions:
      contents: write
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev'
    steps:
      - name: Install Go
        uses: actions/setup-go@v3
        with:
          go-version: 1.25.x
      - name: Checkout
        uses: actions/checkout@v3
      - name: Cache Modules
        uses: actions/cache@v3
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-v1-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Bump version
        id: bump-version
        uses: ./bump-version
        with:
          strategies-by-branch: master=bump_minor,dev=bump_rc
      - name: Compile binaries
        uses: ./compile-go
        with:
          executable-paths: ./bump-version,./compile-go,./create-github-release,./build-docker,./stitch-docker,./publish-cli,./update-homebrew-formula
          linker-mode: cli
          dist-dir: dist/
          version: ${{ steps.bump-version.outputs.version }}
      - name: Create release
        uses: ./create-github-release
        with:
          attachments: dist/*
          version: ${{ steps.bump-version.outputs.version }}
          latest: ${{ github.ref == 'refs/heads/master' }}
