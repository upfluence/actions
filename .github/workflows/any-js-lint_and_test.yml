name: any-js-lint_and_test

on:
  workflow_call:
    inputs:
      node-version:
        description: Node version; defaults to vars.NODE_VERSION, then 20.
        required: false
        type: string
        default: ""
      timeout-minutes:
        required: false
        type: number
        default: 10
      scenarios:
        type: string
        default: ""
      test-variants:
        type: string
        default: '[{"name":"default","command":"pnpm test:ember"}]'
      compatibility-blocking:
        type: boolean
        default: false
      ember-try-working-directory:
        type: string
        default: "."

env:
  NODE_VERSION: ${{ inputs.node-version || vars.NODE_VERSION || '20' }}
  GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
  GIT_TERMINAL_PROMPT: "0"
  FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    if: |
      !contains('refs/heads/master refs/heads/main', github.ref) ||
      contains(github.ref, 'refs/tags/v')
    steps:
      - uses: upfluence/actions/setup-js@master
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ vars.PNPM_VERSION }}
      - name: Lint
        run: pnpm lint:js
      - name: Lint HBS
        run: pnpm prettier -c **/*.hbs
  test:
    uses: ./.github/workflows/any-js-ember-test.yml
    secrets: inherit
    with:
      node-version: ${{ inputs.node-version }}
      timeout-minutes: ${{ inputs.timeout-minutes }}
      scenarios: ${{ inputs.scenarios }}
      test-variants: ${{ inputs.test-variants }}
      compatibility-blocking: ${{ inputs.compatibility-blocking }}
      ember-try-working-directory: ${{ inputs.ember-try-working-directory }}
